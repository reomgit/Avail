name: Bug report
description: Report reproducible behavior in Avail.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Avail. Do not attach copyrighted books; use a public-domain or synthetic fixture.
  - type: input
    id: version
    attributes:
      label: Avail version or commit
      placeholder: 0.1.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 14.7, MacBook Air (M2)
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Book format
      options:
        - EPUB
        - PDF with selectable text
        - Not book-specific
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include the smallest sequence that reproduces the problem.
      placeholder: |
        1. Import a synthetic EPUB…
        2. Start listening…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed book text, personal file paths, and other private content from this report.
          required: true
