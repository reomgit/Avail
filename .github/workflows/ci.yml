name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Record toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project Avail.xcodeproj -scheme Avail

      - name: Check Swift formatting
        run: swift format lint --strict --recursive --parallel --configuration .swift-format Avail Modules Tests

      - name: Run tests
        run: |
          xcodebuild test \
            -project Avail.xcodeproj \
            -scheme Avail \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build and inspect universal Release app
        run: |
          xcodebuild build \
            -project Avail.xcodeproj \
            -scheme Avail \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath .build/ci \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO
          ALLOW_UNSIGNED=1 EXPECTED_ARCHS='arm64 x86_64' \
            bash Scripts/verify-app.sh .build/ci/Build/Products/Release/Avail.app
